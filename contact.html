<!doctype html>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Voyage Doré</a>
      <nav class="main-nav">
        <a href="destinations.html">Destinations</a>
        <a href="gallery.html">Gallery</a>

  <main class="container">
    <h1>Contact</h1>
    <p class="lead">Schreiben Sie uns für individuelle Reisen oder Anfragen.</p>
    <form class="contact-form">
      <label>Ihr Name<input type="text" name="name" required></label>
      <label>Email<input type="email" name="email" required></label>
      <label>Nachricht<textarea name="message" rows="6" required></textarea></label>
      <button class="btn" type="submit">Absenden</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">© 2026 Voyage Doré</div>
  </footer>
