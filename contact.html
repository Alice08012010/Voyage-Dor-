<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kontakt — Voyage Doré</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Voyage Doré</a>
      <nav class="main-nav">
        <a href="destinations.html">Reiseziele</a>
        <a href="gallery.html">Magazin</a>
        <a href="about.html">Philosophie</a>
        <a href="contact.html" class="cta">Kontakt</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="section page-intro">
      <span class="eyebrow">Kontakt</span>
      <h1>Wir begleiten Ihre nächste Reise.</h1>
      <p class="section-lead">Schreiben Sie uns für ein Angebot oder eine persönliche Reiseidee.</p>
    </section>
    <section class="section">
      <form class="contact-form">
        <label>Ihr Name<input type="text" name="name" required></label>
        <label>Email<input type="email" name="email" required></label>
        <label>Nachricht<textarea name="message" rows="6" required></textarea></label>
        <button class="btn" type="submit">Absenden</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>© 2026 Voyage Doré</div>
      <nav class="footer-nav">
        <a href="index.html">Startseite</a>
        <a href="about.html">Philosophie</a>
      </nav>
    </div>
  </footer>
</body>
</html>
